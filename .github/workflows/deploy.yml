name: Deploy L2TP VPN on Ubuntu
run-name: Setting up L2TP VPN — ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      vpn_ipsec_key:
        description: 'IPsec Pre-Shared Key — leave empty to auto-generate'
        required: false
        default: ''
      vpn_username:
        description: 'VPN Username'
        required: true
        default: 'vpnuser'
      vpn_password:
        description: 'VPN Password'
        required: true
        default: ''
      public_ip:
        description: 'Server Public IP — auto-detect if left blank'
        required: false
        default: ''

jobs:
  deploy-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: Gather System Info & Generate Secrets
        id: secrets
        shell: bash
        run: |
          set -e
          if [[ -z "${{ inputs.vpn_ipsec_key }}" ]]; then
            VPN_IPSEC_KEY=$(openssl rand -base64 24)
          else
            VPN_IPSEC_KEY="${{ inputs.vpn_ipsec_key }}"
          fi
          if [[ -z "${{ inputs.public_ip }}" ]]; then
            PUBLIC_IP=$(curl -s -4 ifconfig.me || curl -s -4 icanhazip.com)
          else
            PUBLIC_IP="${{ inputs.public_ip }}"
          fi
          echo "VPN_IPSEC_KEY=$VPN_IPSEC_KEY" >> $GITHUB_OUTPUT
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "VPN_USER=${{ inputs.vpn_username }}" >> $GITHUB_OUTPUT
          echo "VPN_PASS=${{ inputs.vpn_password }}" >> $GITHUB_OUTPUT

      - name: Install L2TP and IPsec Packages
        shell: bash
        run: |
          set -e
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y strongswan strongswan-starter xl2tpd iptables-persistent

      - name: Configure IPsec — strongswan
        shell: bash
        run: |
          set -e
          sudo tee /etc/ipsec.conf > /dev/null <<'IPSECCONF'
config setup
    charondebug="ike 2, knl 2, cfg 0"
    uniqueids=no

conn l2tp-psk
    keyexchange=ikev1
    left=%defaultroute
    leftprotoport=17/1701
    right=%any
    rightprotoport=17/%any
    type=transport
    authby=secret
IPSECCONF

          sudo tee /etc/ipsec.secrets > /dev/null <<EOF
: PSK "${{ steps.secrets.outputs.VPN_IPSEC_KEY }}"
EOF
          sudo chmod 600 /etc/ipsec.secrets
          sudo systemctl restart strongswan-starter
          sudo systemctl enable strongswan-starter

      - name: Configure XL2TPD
        shell: bash
        run: |
          set -e
          sudo tee /etc/xl2tpd/xl2tpd.conf > /dev/null <<'L2TPDCONF'
[global]
ipsec saref = yes
listen-addr = 0.0.0.0

[lns default]
ip range = 10.0.2.2-10.0.2.254
local ip = 10.0.2.1
require chap = yes
refuse pap = yes
require authentication = yes
name = l2tp-vpn-server
ppp debug = yes
pppoptfile = /etc/ppp/options.xl2tpd
length bit = yes
L2TPDCONF

          sudo tee /etc/ppp/options.xl2tpd > /dev/null <<'PPPOPTS'
require-mschap-v2
ms-dns 8.8.8.8
ms-dns 1.1.1.1
asyncmap 0
auth
hide-password
debug
proxyarp
lcp-echo-failure 4
lcp-echo-interval 30
PPPOPTS

          VPN_USER="${{ steps.secrets.outputs.VPN_USER }}"
          VPN_PASS="${{ steps.secrets.outputs.VPN_PASS }}"
          echo "$VPN_USER l2tp-vpn-server $VPN_PASS *" | sudo tee /etc/ppp/chap-secrets > /dev/null
          sudo chmod 600 /etc/ppp/chap-secrets
          sudo systemctl restart xl2tpd
          sudo systemctl enable xl2tpd

      - name: Configure Kernel and IP Forwarding
        shell: bash
        run: |
          set -e
          sudo tee /etc/sysctl.d/99-vpn-forward.conf > /dev/null <<'SYSCTL'
net.ipv4.ip_forward = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.all.rp_filter = 0
SYSCTL
          sudo sysctl -p /etc/sysctl.d/99-vpn-forward.conf

      - name: Set Firewall and NAT Rules
        shell: bash
        run: |
          set -e
          sudo iptables -F
          sudo iptables -t nat -F
          PUBLIC_IFACE=$(ip route get 1.1.1.1 | awk '/dev/ { print $5; exit }')
          sudo iptables -t nat -A POSTROUTING -o "$PUBLIC_IFACE" -j MASQUERADE
          sudo iptables -A INPUT -p udp --dport 500 -j ACCEPT
          sudo iptables -A INPUT -p udp --dport 4500 -j ACCEPT
          sudo iptables -A INPUT -p udp --dport 1701 -j ACCEPT
          sudo iptables -A INPUT -p esp -j ACCEPT
          sudo netfilter-persistent save
          sudo systemctl restart xl2tpd
          sudo systemctl restart strongswan-starter

      - name: VPN Deployment Complete — Details
        shell: bash
        run: |
          echo "============================================================"
          echo "     L2TP VPN SERVER DETAILS"
          echo "============================================================"
          echo "  SERVER IP:     ${{ steps.secrets.outputs.PUBLIC_IP }}"
          echo "  IPsec PSK:     ${{ steps.secrets.outputs.VPN_IPSEC_KEY }}"
          echo "  USERNAME:      ${{ steps.secrets.outputs.VPN_USER }}"
          echo "  PASSWORD:      ${{ steps.secrets.outputs.VPN_PASS }}"
          echo "============================================================"
          echo "  Protocol:      L2TP over IPsec"
          echo "  DNS:           8.8.8.8 / 1.1.1.1"
          echo "  IP Pool:       10.0.2.2 — 10.0.2.254"
          echo "============================================================"
