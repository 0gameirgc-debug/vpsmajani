- name: Install xray
  run: |
    bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
- name: Configure & start xray
  run: |
    # ساخت فایل کانفیگ
    cat > /usr/local/etc/xray/config.json << 'EOF'
    { "log": { "loglevel": "warning" }, "inbounds": [ { "port": 10808, "protocol": "socks", "settings": { "auth": "noauth" } } ], "outbounds": [ { "protocol": "vless", "settings": { "vnext": [ { "address": "آدرس-سرور", "port": 443, "users": [ { "id": "UUID-شما", "flow": "xtls-rprx-vision" } ] } ] } } ] }
    EOF
    xray run -c /usr/local/etc/xray/config.json &
    sleep 2
- name: Set proxy env
  run: |
    echo "http_proxy=http://127.0.0.1:10808" >> $GITHUB_ENV
    echo "https_proxy=http://127.0.0.1:10808" >> $GITHUB_ENV
    echo "ALL_PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV
