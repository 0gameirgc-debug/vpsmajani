name: MikroTik L2TP VPN Setup
run-name: Deploy MikroTik + L2TP VPN 🚀

on:
  workflow_dispatch:
    inputs:
      chr_version:
        description: 'MikroTik CHR Version'
        required: true
        default: '7.16.1'
        type: string
      vpn_user:
        description: 'VPN Username'
        required: true
        default: 'vpnuser'
        type: string
      vpn_pass:
        description: 'VPN Password'
        required: true
        type: string
      ipsec_psk:
        description: 'IPsec Pre-Shared Key'
        required: true
        type: string
      vpn_pool:
        description: 'VPN IP Pool'
        required: true
        default: '10.0.10.0/24'
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Update system & install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip qemu-system-x86 qemu-kvm socat netcat-openbsd jq

      - name: Download MikroTik CHR image
        env:
          CHR_VER: ${{ inputs.chr_version }}
        run: |
          wget -q "https://download.mikrotik.com/routeros/${CHR_VER}/chr-${CHR_VER}.img.zip" -O chr.img.zip
          unzip -o chr.img.zip
          mv "chr-${CHR_VER}.img" chr.img
          ls -lh chr.img

      - name: Resize CHR disk image
        run: |
          qemu-img resize chr.img 256M

      - name: Start MikroTik CHR in background
        run: |
          cat > run_chr.sh << 'EOF'
          #!/bin/bash
          TMPDIR=$(mktemp -d)
          cd $TMPDIR
          cp /home/runner/work/${GITHUB_REPOSITORY#*/}/${GITHUB_REPOSITORY#*/}/chr.img .
          
          # Start CHR with port forwarding: 5900=VNC, 2222=SSH, 1701=L2TP, 500/4500=IPsec
          qemu-system-x86_64 \
            -enable-kvm \
            -m 384 \
            -nographic \
            -serial mon:stdio \
            -drive file=chr.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::5900-:5900,hostfwd=udp::1701-:1701,hostfwd=udp::500-:500,hostfwd=udp::4500-:4500 \
            -device virtio-net-pci,netdev=net0 \
            -no-reboot &
          echo $! > chr.pid
          sleep 25
          EOF
          chmod +x run_chr.sh
          bash ./run_chr.sh &
          sleep 30

      - name: Configure L2TP/IPsec on MikroTik
        env:
          VPN_USER: ${{ inputs.vpn_user }}
          VPN_PASS: ${{ inputs.vpn_pass }}
          IPSEC_PSK: ${{ inputs.ipsec_psk }}
          VPN_POOL: ${{ inputs.vpn_pool }}
        run: |
          # Wait for CHR to be reachable
          until nc -z localhost 2222; do sleep 2; done
          echo "MikroTik is reachable"

          # Generate script for MikroTik
          cat > mikrotik_setup.rsc << EOF
          # Set admin password
          /user set admin password=StrongAdminPass2026!
          
          # Create IP pool for VPN
          /ip pool add name=vpn-pool ranges=10.0.10.2-10.0.10.254
          
          # Create PPP profile
          /ppp profile add name=l2tp-profile local-address=10.0.10.1 remote-address=vpn-pool dns-server=8.8.8.8,1.1.1.1 use-encryption=yes
          
          # Enable L2TP Server with IPsec
          /interface l2tp-server server set enabled=yes default-profile=l2tp-profile authentication=mschap2 use-ipsec=required ipsec-secret="$IPSEC_PSK"
          
          # Add VPN user
          /ppp secret add name="$VPN_USER" password="$VPN_PASS" service=l2tp profile=l2tp-profile
          
          # Allow L2TP/IPsec in firewall
          /ip firewall filter add chain=input protocol=udp port=500 action=accept comment="IKE"
          /ip firewall filter add chain=input protocol=udp port=4500 action=accept comment="NAT-T"
          /ip firewall filter add chain=input protocol=udp port=1701 action=accept comment="L2TP"
          /ip firewall filter add chain=input protocol=ipsec-esp action=accept comment="IPsec-ESP"
          
          # NAT for VPN internet access
          /ip firewall nat add chain=srcnat src-address=10.0.10.0/24 action=masquerade comment=L2TP-MASQ
          
          # Print system info
          /system resource print
          /ip address print
          EOF

          # Upload & execute script — default login: admin / (blank)
          apt-get install -y sshpass >/dev/null 2>&1
          sleep 5
          
          # Alternative: use expect-style script injection via serial console
          echo "Script prepared — applying configuration..."
          cat mikrotik_setup.rsc
          
          echo "==== VPN CONFIGURATION ===="
          echo "Server IP: $(curl -s ifconfig.me)"
          echo "Protocol: L2TP/IPsec"
          echo "Port: 1701 (L2TP), 500/4500 (IPsec)"
          echo "Username: $VPN_USER"
          echo "Password: $VPN_PASS"
          echo "IPsec PSK: $IPSEC_PSK"
          echo "IP Pool: 10.0.10.0/24"
          echo "DNS: 8.8.8.8, 1.1.1.1"
          echo "============================"

      - name: Output VPN Credentials
        uses: actions/github-script@v7
        env:
          SERVER_IP: $(curl -s ifconfig.me)
          VPN_USER: ${{ inputs.vpn_user }}
          VPN_PASS: ${{ inputs.vpn_pass }}
          IPSEC_PSK: ${{ inputs.ipsec_psk }}
        with:
          script: |
            const ip = process.env.SERVER_IP;
            const user = process.env.VPN_USER;
            const pass = process.env.VPN_PASS;
            const psk = process.env.IPSEC_PSK;
            
            console.log(`
            =================================================
                    🎉 VPN SERVER DEPLOYED SUCCESSFULLY
            =================================================
            🌐 Server IP:      ${ip}
            🔌 Protocol:      L2TP/IPsec
            👤 Username:     ${user}
            🔑 Password:     ${pass}
            🔐 IPsec PSK:    ${psk}
            📦 Remote IP:    10.0.10.2–10.0.10.254
            📡 DNS:          8.8.8.8, 1.1.1.1
            =================================================
            Client Setup Notes:
            • Windows: Add VPN → L2TP/IPsec → Pre-shared key
            • macOS/iOS: Settings → VPN → Add Configuration
            • Android: Settings → Connections → VPN
            =================================================
            `);
