name: Deploy L2TP VPN Server
run-name: L2TP VPN — ${{ github.actor }} — ${{ github.run_id }}
on:
  workflow_dispatch: {}

jobs:
  vpn-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Secure Credentials
        id: creds
        shell: bash
        run: |
          set -e
          VPN_USER=$(openssl rand -hex 6)
          VPN_PASS=$(openssl rand -base64 12)
          VPN_PSK=$(openssl rand -base64 24)
          PUBLIC_IP=$(curl -s -4 ifconfig.me || curl -s -4 icanhazip.com || echo "127.0.0.1")
          echo "VPN_USER=$VPN_USER" >> $GITHUB_OUTPUT
          echo "VPN_PASS=$VPN_PASS" >> $GITHUB_OUTPUT
          echo "VPN_PSK=$VPN_PSK" >> $GITHUB_OUTPUT
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Update System & Install Packages
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get upgrade -y -qq
          sudo apt-get install -y strongswan strongswan-starter xl2tpd iptables-persistent

      - name: Configure IPsec
        shell: bash
        run: |
          set -e
          # Write ipsec.conf using base64 — NO HEREDOCS
          cat > /tmp/ipsec.b64 << 'B64END'

B64END
          base64 -d /tmp/ipsec.b64 | sudo tee /etc/ipsec.conf > /dev/null
          rm /tmp/ipsec.b64
          # Write PSK
          echo ": PSK \"${{ steps.creds.outputs.VPN_PSK }}\"" | sudo tee /etc/ipsec.secrets > /dev/null
          sudo chmod 600 /etc/ipsec.secrets
          sudo systemctl enable --now strongswan-starter

      - name: Configure XL2TPD
        shell: bash
        run: |
          set -e
          # xl2tpd.conf — base64
          cat > /tmp/l2tp.b64 << 'B64END'

B64END
          base64 -d /tmp/l2tp.b64 | sudo tee /etc/xl2tpd/xl2tpd.conf > /dev/null
          rm /tmp/l2tp.b64
          # ppp options — base64
          cat > /tmp/ppp.b64 << 'B64END'
cmVxdWlyZS1tc2NoYXBtdjIKbXMtZG5zIDguOC44LjgKbXMtZG5zIDEuMS4xLjEKYXN5bmNtYXAgMAphdXRoCmhpZGUtcGFzc3dvcmQKcHJveHlhcnAKbGNwLWVjaG8tZmFpbHVyZSA0CmxjcC1lY2hvLWludGVydmFsIDMwCg==
B64END
          base64 -d /tmp/ppp.b64 | sudo tee /etc/ppp/options.xl2tpd > /dev/null
          rm /tmp/ppp.b64
          # chap-secrets
          echo "${{ steps.creds.outputs.VPN_USER }} l2tp-vpn ${{ steps.creds.outputs.VPN_PASS }} *" | sudo tee /etc/ppp/chap-secrets > /dev/null
          sudo chmod 600 /etc/ppp/chap-secrets
          sudo systemctl enable --now xl2tpd

      - name: Enable IP Forwarding
        shell: bash
        run: |
          set -e
          cat > /tmp/sysctl.b64 << 'B64END'
bmV0LmlwdjQuanBfZm9yd2FyZCA9IDEKbmV0LmlwdjQuY29uZi5hbGwuYWNjZXB0X3JlZGlcmVjdHMgPSAwCm5ldC5pcHY0LmNvbmYuYWxsLnNlbl9yZWRpcmVjdHMgPSAwCm5ldC5pcHY0LmNvbmYuZGVmYXVsdC5ycF9maWx0ZXIgPSAwCg==
B64END
          base64 -d /tmp/sysctl.b64 | sudo tee /etc/sysctl.d/99-vpn.conf > /dev/null
          rm /tmp/sysctl.b64
          sudo sysctl -p /etc/sysctl.d/99-vpn.conf

      - name: Setup Firewall & NAT
        shell: bash
        run: |
          set -e
          sudo iptables -F
          sudo iptables -t nat -F
          IFACE=$(ip route get 1.1.1.1 | awk '/src/ {print $5; exit}')
          [ -z "$IFACE" ] && IFACE=eth0
          sudo iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          sudo iptables -A INPUT -p udp --dport 500 -j ACCEPT
          sudo iptables -A INPUT -p udp --dport 4500 -j ACCEPT
          sudo iptables -A INPUT -p udp --dport 1701 -j ACCEPT
          sudo iptables -A INPUT -p esp -j ACCEPT
          sudo netfilter-persistent save
          sudo systemctl restart xl2tpd
          sudo systemctl restart strongswan-starter

      - name: VPN Ready — Connection Details
        shell: bash
        run: |
          echo "===================================================================="
          echo "     L2TP VPN SERVER — CONNECTION INFO"
          echo "===================================================================="
          echo "  SERVER IP  :  ${{ steps.creds.outputs.PUBLIC_IP }}"
          echo "  IPsec PSK  :  ${{ steps.creds.outputs.VPN_PSK }}"
          echo "  USERNAME   :  ${{ steps.creds.outputs.VPN_USER }}"
          echo "  PASSWORD   :  ${{ steps.creds.outputs.VPN_PASS }}"
          echo "===================================================================="
          echo "  PROTOCOL   :  L2TP/IPsec"
          echo "  DNS        :  8.8.8.8 / 1.1.1.1"
          echo "===================================================================="
